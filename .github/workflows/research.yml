name: Reproduce research artifact
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: research-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/tests.yml
  reproduce:
    name: Paired scripted and HTTP measurements
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -e . -r requirements-paper.txt
      - run: python -m benchmarks.adaptive --trials 30 --split evaluation --output artifacts/adaptive.json
      - run: python -m benchmarks.matched --trials 30 --output artifacts/matched.json
      - run: python -m benchmarks.load --repetitions 3 --duration 5 --legitimate-rate 10 --probe-rate 50 --workers 16 --output artifacts/load.json
      - run: python -m scripts.check_extended_artifacts artifacts/adaptive.json artifacts/matched.json artifacts/load.json
      - run: python -m scripts.research_figures --adaptive artifacts/adaptive.json --load artifacts/load.json --matched artifacts/matched.json --output artifacts/figures
      - run: python -m pip freeze > artifacts/python-packages.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: reproduced-study-${{ github.sha }}-${{ github.run_id }}
          path: artifacts/**
          if-no-files-found: error
          retention-days: 30
