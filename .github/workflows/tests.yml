name: CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  workflow-lint:
    name: Workflow syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate workflow syntax with checksum-verified actionlint
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz -o actionlint.tar.gz
          echo '023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  actionlint.tar.gz' | sha256sum --check
          tar -xzf actionlint.tar.gz actionlint
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/actionlint" -color
  security:
    name: Security and protocol (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python -m benchmarks.scripted
  research:
    name: Research artifact checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python -m benchmarks.pilot --trials 30 --seed 2026 --output artifacts/pilot.json
      - run: python -m benchmarks.objective --trials 30 --seed 10000 --output artifacts/objective.json
      - run: python scripts/check_artifacts.py artifacts/pilot.json artifacts/objective.json
      - run: python -m benchmarks.adaptive --trials 2 --split development --output artifacts/adaptive-smoke.json
      - run: python -m scripts.check_extended_artifacts artifacts/adaptive-smoke.json
      - run: python -m benchmarks.matched --trials 2 --output artifacts/matched-smoke.json
      - run: python -m scripts.check_extended_artifacts artifacts/matched-smoke.json
      - run: python -m pip freeze > artifacts/python-packages.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: research-${{ github.sha }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30
  package:
    name: Build and install distribution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install build==1.6.1 twine==7.0.0
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Smoke test installed wheel outside checkout
        run: |
          python -m venv "$RUNNER_TEMP/wheel-venv"
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-venv/bin/python" -m openmaze --help
          "$RUNNER_TEMP/wheel-venv/bin/python" -m openmaze init --state wheel-state
      - name: Research smoke from extracted source archive
        run: |
          python - <<'PYCODE'
          import pathlib, subprocess, sys, tarfile, tempfile
          with tempfile.TemporaryDirectory() as directory:
              with tarfile.open(next(pathlib.Path('dist').glob('*.tar.gz'))) as archive:
                  archive.extractall(directory, filter='data')
              root = next(p for p in pathlib.Path(directory).iterdir() if p.is_dir())
              output = pathlib.Path(directory) / 'archive-objective.json'
              subprocess.run([sys.executable, '-m', 'benchmarks.objective', '--trials', '2', '--output', str(output)], cwd=root, check=True)
              subprocess.run([sys.executable, 'scripts/check_artifacts.py', str(output)], cwd=root, check=True)
          PYCODE
      - run: sha256sum dist/* > dist/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 30
  containers:
    name: Container boundaries and lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: docker build -t openmaze:ci .
      - run: python scripts/container_checks.py --image openmaze:ci
  paper:
    name: Build research draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . -r requirements-paper.txt
      - run: python -m scripts.build_paper
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: paper-draft
          path: artifacts/paper/*
          if-no-files-found: error
          retention-days: 30
