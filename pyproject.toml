[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openmaze"
version = "0.1.0"
description = "A bounded, local API deception research testbed"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["cryptography==50.0.2"]
license = {text = "Apache-2.0"}

[project.scripts]
openmaze = "openmaze.__main__:main"

[tool.setuptools.packages.find]
include = ["openmaze*"]
